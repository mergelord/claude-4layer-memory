name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Review this pull request for the claude-4layer-memory Python project.
            Focus on:
            - Correctness and logic errors
            - Type hint compliance (required for all functions)
            - Google-style docstrings
            - Cyclomatic complexity (<10 per function)
            - Security issues (SQL injection, path traversal, hardcoded secrets)
            - Encoding safety (mojibake risks in memory files)
            - Test coverage for new code
            Be concise. Flag real issues, not style nitpicks.
