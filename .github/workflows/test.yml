name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ubuntu-python-3-10:
    name: Ubuntu / Python 3.10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Run health check
        run: |
          python scripts/health_memory_size.py

      - name: Run memory lint quick check
        run: |
          python scripts/memory_lint.py --help

      - name: Test audit script
        run: |
          python audit.py --help

      - name: Verify scripts are executable
        run: |
          chmod +x scripts/linux/*.sh
          chmod +x install.sh
          chmod +x audit.sh

